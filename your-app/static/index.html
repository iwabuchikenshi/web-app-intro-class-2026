<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wantapp</title>
    <link rel="stylesheet" href="/style.css?v=2" />
  </head>
  <body>
    <!-- ヘッダー -->
    <header class="header">
      <h1>Wantapp</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="todo-card">
      <!-- エラーメッセージ表示エリア -->
      <div id="error-message" class="error-message" style="display: none"></div>

      <!-- 欲しいもの入力エリア -->
      <form id="todo-form" class="input-area">
        <input
          type="text"
          id="todo-input"
          class="todo-input"
          placeholder="欲しいものを入力"
          maxlength="100"
          autocomplete="off"
        />

        <input
          type="number"
          id="price-input"
          class="todo-input"
          placeholder="値段を入力"
          min="0"
          autocomplete="off"
        />

        <button type="submit" class="todo-button">追加</button>
      </form>

      <!-- 欲しいものリスト -->
      <ul id="todo-list" class="todo-list"></ul>
    </main>

    <!-- フッター -->
    <footer class="footer">
      <p>&copy; 2026 Wantapp</p>
    </footer>

    <script src="/app.js?v=2"></script>
  </body>
     </html>
